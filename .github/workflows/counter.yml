name: Update day counter

on:
  schedule:
    - cron: "7 21 * * *"   # 00:07 in Nairobi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    env:
      START_DATE: "2026-06-17"   # first commit of Microsoft-Access-Pong
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the counter
        run: |
          days=$(( ( $(TZ=Africa/Nairobi date +%s) - $(TZ=Africa/Nairobi date -d "$START_DATE" +%s) ) / 86400 ))
          sed -i -E "s|(<!--DAYS-->)[0-9]+(<!--/DAYS-->)|\1${days}\2|" README.md
      - name: Commit if it changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Day counter: tick"
          git push
