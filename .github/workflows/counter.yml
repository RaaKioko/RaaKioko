name: Update day counter

on:
  schedule:
    - cron: "7 21 * * *"   # 00:07 in Nairobi
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rewrite the counter
        run: python3 scripts/tick.py
      - name: Commit if it changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -am "Day counter: tick"
          git push
