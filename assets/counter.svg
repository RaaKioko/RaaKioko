<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 120" width="840" height="120" role="img" aria-label="Days since I published Pong in Microsoft Access and nobody stopped me">
<defs><linearGradient id="e" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="840" y2="0" spreadMethod="repeat"><stop offset="0.000" stop-color="#3dff8f"/><stop offset="0.250" stop-color="#22e6ff"/><stop offset="0.500" stop-color="#8b5cff"/><stop offset="0.750" stop-color="#ff2bd6"/><stop offset="1" stop-color="#3dff8f"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="840 0" dur="6s" repeatCount="indefinite"/></linearGradient><linearGradient id="n" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="200" y2="0" spreadMethod="repeat"><stop offset="0.000" stop-color="#ffe14d"/><stop offset="0.333" stop-color="#ff8a2b"/><stop offset="0.667" stop-color="#ff2bd6"/><stop offset="1" stop-color="#ffe14d"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="200 0" dur="3s" repeatCount="indefinite"/></linearGradient><filter id="glow" x="-30%" y="-60%" width="160%" height="220%"><feGaussianBlur stdDeviation="6"/></filter></defs>
<rect x="2" y="2" width="836" height="116" rx="16" fill="#05010f" stroke="url(#e)" stroke-width="3"/>
<text x="150" y="82" text-anchor="middle" style="font:900 64px 'Segoe UI',Inter,Helvetica,Arial,sans-serif" fill="url(#n)" filter="url(#glow)" opacity=".8" id="daysglow">152</text>
<text x="150" y="82" text-anchor="middle" style="font:900 64px 'Segoe UI',Inter,Helvetica,Arial,sans-serif" fill="url(#n)" id="days">152<animate attributeName="opacity" values="1;1;.35;1;.6;1;1" keyTimes="0;.86;.88;.9;.93;.95;1" dur="4s" repeatCount="indefinite"/></text>
<text x="290" y="44" style="font:800 18px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:2px" fill="#22e6ff">DAYS SINCE I PUBLISHED PONG</text>
<text x="290" y="69" style="font:800 18px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:2px" fill="#3dff8f">IN MICROSOFT ACCESS</text>
<text x="290" y="94" style="font:800 18px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:2px" fill="#ff2bd6">AND NOBODY STOPPED ME</text>
<g fill="#ffe14d"><circle cx="620" cy="60" r="9"><animate attributeName="cy" values="60;36;60" dur="1.1s" repeatCount="indefinite"/><animate attributeName="fill" values="#ffe14d;#ff2bd6;#22e6ff;#ffe14d" dur="3s" begin="-0.0s" repeatCount="indefinite"/></circle><circle cx="660" cy="74" r="8"><animate attributeName="cy" values="74;50;74" dur="1.3s" repeatCount="indefinite"/><animate attributeName="fill" values="#ffe14d;#ff2bd6;#22e6ff;#ffe14d" dur="3s" begin="-0.6s" repeatCount="indefinite"/></circle><circle cx="700" cy="60" r="7"><animate attributeName="cy" values="60;36;60" dur="1.5s" repeatCount="indefinite"/><animate attributeName="fill" values="#ffe14d;#ff2bd6;#22e6ff;#ffe14d" dur="3s" begin="-1.2s" repeatCount="indefinite"/></circle><circle cx="740" cy="74" r="6"><animate attributeName="cy" values="74;50;74" dur="1.7000000000000002s" repeatCount="indefinite"/><animate attributeName="fill" values="#ffe14d;#ff2bd6;#22e6ff;#ffe14d" dur="3s" begin="-1.7999999999999998s" repeatCount="indefinite"/></circle><circle cx="780" cy="60" r="5"><animate attributeName="cy" values="60;36;60" dur="1.9000000000000001s" repeatCount="indefinite"/><animate attributeName="fill" values="#ffe14d;#ff2bd6;#22e6ff;#ffe14d" dur="3s" begin="-2.4s" repeatCount="indefinite"/></circle></g>
