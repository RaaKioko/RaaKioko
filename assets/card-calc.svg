<g><text x="176" y="48" style="font:900 26px 'Segoe UI',Inter,Helvetica,Arial,sans-serif" fill="#ff2bd6">+<animateTransform attributeName="transform" type="rotate" values="-12 184 40;12 184 40;-12 184 40" dur="2.0s" repeatCount="indefinite"/></text><text x="202" y="78" style="font:900 26px 'Segoe UI',Inter,Helvetica,Arial,sans-serif" fill="#22e6ff">÷<animateTransform attributeName="transform" type="rotate" values="-12 210 70;12 210 70;-12 210 70" dur="2.5s" repeatCount="indefinite"/></text><text x="228" y="48" style="font:900 26px 'Segoe UI',Inter,Helvetica,Arial,sans-serif" fill="#ffe14d">×<animateTransform attributeName="transform" type="rotate" values="-12 236 40;12 236 40;-12 236 40" dur="3.0s" repeatCount="indefinite"/></text></g>
