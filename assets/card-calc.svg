<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 272 168" width="272" height="168" role="img" aria-label="A calculator built in Microsoft Access.">
<defs><linearGradient id="b" x1="0" y1="0" x2="1" y2="1"><stop offset="0.000" stop-color="#ff8a2b"/><stop offset="0.333" stop-color="#ffe14d"/><stop offset="0.667" stop-color="#ff2bd6"/><stop offset="1.000" stop-color="#ff8a2b"/><animateTransform attributeName="gradientTransform" type="rotate" from="0 .5 .5" to="360 .5 .5" dur="4s" repeatCount="indefinite"/></linearGradient><linearGradient id="tt" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="180" y2="0" spreadMethod="repeat"><stop offset="0.000" stop-color="#ff8a2b"/><stop offset="0.333" stop-color="#ffe14d"/><stop offset="0.667" stop-color="#ff2bd6"/><stop offset="1" stop-color="#ff8a2b"/><animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="180 0" dur="4s" repeatCount="indefinite"/></linearGradient>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0b0218"/><stop offset="1" stop-color="#ff8a2b" stop-opacity=".13"/></linearGradient></defs>
<style>.h{font:900 21px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:1px}.d{font:600 11.5px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#e9e2ff}</style>
<rect x="2" y="2" width="268" height="164" rx="15" fill="#05010f"/>
<rect x="2" y="2" width="268" height="164" rx="15" fill="url(#bg)" stroke="url(#b)" stroke-width="3"/>
<rect x="20" y="20" width="128" height="34" rx="6" fill="#140600" stroke="#ff8a2b"/>
<text x="140" y="44" text-anchor="end" style="font:800 19px ui-monospace,Consolas,monospace" fill="#ffe14d" opacity="1"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.23;.25;1" dur="6s" begin="0.0s" repeatCount="indefinite"/>2 + 2</text><text x="140" y="44" text-anchor="end" style="font:800 19px ui-monospace,Consolas,monospace" fill="#ffe14d" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.23;.25;1" dur="6s" begin="1.5s" repeatCount="indefinite"/>= 4</text><text x="140" y="44" text-anchor="end" style="font:800 19px ui-monospace,Consolas,monospace" fill="#ffe14d" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.23;.25;1" dur="6s" begin="3.0s" repeatCount="indefinite"/>bc y not</text><text x="140" y="44" text-anchor="end" style="font:800 19px ui-monospace,Consolas,monospace" fill="#ffe14d" opacity="0"><animate attributeName="opacity" values="0;1;1;0;0" keyTimes="0;.02;.23;.25;1" dur="6s" begin="4.5s" repeatCount="indefinite"/>= yes</text>
